# .github/workflows/api-ci-build.yml
name: API CI

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master, development ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1) Checkout the repo
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2) Cache NuGet packages
      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('src/LOMs.Api/**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # 3) Install .NET SDK
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # 4) Restore your API’s dependencies
      - name: dotnet restore
        run: dotnet restore src/LOMs.Api/LOMs.Api.csproj

      # 5) Build in Release (no restore)
      - name: dotnet build
        run: dotnet build src/LOMs.Api/LOMs.Api.csproj --configuration Release --no-restore

      # 6) (Optional) Publish your API artifacts
      # - name: dotnet publish
      #   run: dotnet publish src/LOMs.Api/LOMs.Api.csproj \
      #        --configuration Release \
      #        --output ./publish

