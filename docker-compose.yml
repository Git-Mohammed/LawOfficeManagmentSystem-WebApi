version: "3.8"

services:
  loms-api:
    container_name: loms-api
    build:
      context: .
      dockerfile: Dockerfile
      target: final
    ports:
      - "9092:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:80

      # Database
      - ConnectionStrings__DefaultConnection=${DB_CONNECTION_STRING}

      # JWT
      - Jwt__Key=${JWT_KEY}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__ExpiryMinutes=${JWT_EXPIRY_MINUTES}

      # SMTP
      - Smtp__Host=${SMTP_HOST}
      - Smtp__Port=${SMTP_PORT}
      - Smtp__Username=${SMTP_USERNAME}
      - Smtp__Password=${SMTP_PASSWORD}
      - Smtp__EnableSsl=${SMTP_ENABLE_SSL}
      - Smtp__From=${SMTP_FROM}

      # Password generator
      - PasswordGenerator__Key=${PASSWORD_GENERATOR_KEY}

      # Serilog Seq sink
      - Serilog__WriteTo__1__Name=Seq
      - Serilog__WriteTo__1__Args__serverUrl=http://seq:5341

    depends_on:
      - sqlserver
      - seq
    networks:
      - loms-net
    restart: on-failure

  sqlserver:
    container_name: loms-sql
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=YourStrong@Password1
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    networks:
      - loms-net
    restart: always

  seq:
    image: datalust/seq:latest
    container_name: seq
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=true
    ports:
      - "5341:5341"
      - "8081:80"
    volumes:
      - seq-data:/data
    networks:
      - loms-net
    restart: unless-stopped

volumes:
  sqlserver-data: {}
  seq-data: {}

networks:
  loms-net:
    driver: bridge
